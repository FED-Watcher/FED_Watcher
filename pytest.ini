[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = src
addopts = 
    -v
    --strict-markers
    --cov=src
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-fail-under=10
markers =
    critical: Critical tests that must pass
    slow: Tests that take >5 seconds
    integration: Integration tests
    acceptance: Acceptance tests
    unit: Unit tests
