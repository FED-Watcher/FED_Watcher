name: Python CI/CD Pipeline

# Triggers - when this workflow runs
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:  # Manual trigger

# Environment variables
env:
  PYTHON_VERSION: '3.9'
  MIN_COVERAGE: 80

# Jobs - CI/CD Pipeline Stages
jobs:
  
  # Stage 1: Code Quality (Linting)
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install black flake8 pylint
        
    - name: Check code formatting with Black
      run: black --check src/ tests/
      
    - name: Lint with Flake8
      run: |
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
        
    - name: Analyze with Pylint
      run: pylint src/ --fail-under=7.0 --exit-zero

  # Stage 2: Security Scanning
  security:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run Bandit security scan
      run: bandit -r src/ -f json -o bandit-report.json
      continue-on-error: true
      
    - name: Run Safety dependency check
      run: safety check --json > safety-report.json
      continue-on-error: true
      
    - name: Upload security reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-reports
        path: |
          bandit-report.json
          safety-report.json
        retention-days: 30

  # Stage 3: Unit Tests (Multiple Python Versions)
  unit-tests:
    name: Unit Tests - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint]
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-xdist pytest-timeout
    - name: Install project dependencies
      run: |
        echo "Installing from requirements.txt..."
        pip install -r requirements.txt
        echo "Installing from requirements-dev.txt..."
        pip install -r requirements-dev.txt
        echo "Verifying pandas installation..."
        python -c "import pandas; print(f'Pandas version: {pandas.__version__}')"
        echo "Verifying numpy installation..."
        python -c "import numpy; print(f'Numpy version: {numpy.__version__}')"
        echo "Verifying sklearn installation..."
        python -c "import sklearn; print(f'Sklearn version: {sklearn.__version__}')"

    - name: Run unit tests with coverage
      run: |
        pytest tests/unit/ \
          -v \
          --cov=src \
          --cov-report=xml \
          --cov-report=html \
          --cov-report=term-missing \
          --cov-fail-under=${{ env.MIN_COVERAGE }} \
          --junitxml=junit/unit-results-${{ matrix.python-version }}.xml \
          --timeout=300 \
          -n auto
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: unit-test-results-py${{ matrix.python-version }}
        path: |
          junit/unit-results-${{ matrix.python-version }}.xml
          htmlcov/
        retention-days: 30
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-py${{ matrix.python-version }}
        fail_ci_if_error: false

  # Stage 4: Integration Tests
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov
    - name: Install project dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
        
    - name: Run integration tests
      run: pytest tests/integration/ -v --junitxml=junit/integration-results.xml
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        
    - name: Upload integration test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: integration-test-results
        path: junit/integration-results.xml
        retention-days: 30

  # Stage 5: Cross-Validation Tests (ML Requirement)
  cross-validation:
    name: Cross-Validation Tests
    runs-on: ubuntu-latest
    needs: [unit-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest numpy pandas scikit-learn
    - name: Install project dependencies
      run: |
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Run cross-validation tests
      run: pytest tests/unit/test_cross_validation.py -v --junitxml=junit/cv-results.xml
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        
    - name: Verify 80/20 split requirement
      run: |
        echo "✅ Verifying train/test split acceptance criteria..."
        pytest tests/acceptance/test_data_split.py -v

  # Stage 6: Acceptance Tests
  acceptance-tests:
    name: Acceptance Tests (E2E)
    runs-on: ubuntu-latest
    needs: [integration-tests, cross-validation]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Run acceptance tests
      run: |
        pytest tests/acceptance/ -v --junitxml=junit/acceptance-results.xml
      env:
        PYTHONPATH: ${{ github.workspace }}/src
        
    - name: Upload acceptance test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: acceptance-test-results
        path: junit/acceptance-results.xml
        retention-days: 30

  # Stage 7: Build Package (Python Distribution)
  build:
    name: Build Python Package
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, integration-tests, cross-validation, acceptance-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install build wheel setuptools
        
    - name: Build distribution packages
      run: python -m build
      
    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
        retention-days: 7

  # Stage 8: Coverage Report (Combined)
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all test artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: '*-test-results*'
        
    - name: Set up Python ${{ env.PYTHON_VERSION }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Install coverage tools
      run: |
        python -m pip install --upgrade pip
        pip install coverage coverage-badge
        
    - name: Generate coverage badge
      run: |
        echo "Coverage report generated"
        
    - name: Comment coverage on PR
      if: github.event_name == 'pull_request'
      uses: py-cov-action/python-coverage-comment-action@v3
      with:
        GITHUB_TOKEN: ${{ github.token }}

  

  # Stage 9: Notification
  notify:
    name: Pipeline Status Notification
    runs-on: ubuntu-latest
    needs: [lint, security, unit-tests, integration-tests, cross-validation, acceptance-tests]
    if: always()
    
    steps:
    - name: Check pipeline status
      run: |
        echo "==================================="
        echo "CI/CD Pipeline Status Report"
        echo "==================================="
        echo "Lint: ${{ needs.lint.result }}"
        echo "Security: ${{ needs.security.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Integration: ${{ needs.integration-tests.result }}"
        echo "Cross-validation: ${{ needs.cross-validation.result }}"
        echo "Acceptance: ${{ needs.acceptance-tests.result }}"
        echo "==================================="
        
    - name: Verify all quality gates passed
      run: |
        if [[ "${{ needs.lint.result }}" == "success" ]] && \
           [[ "${{ needs.security.result }}" == "success" ]] && \
           [[ "${{ needs.unit-tests.result }}" == "success" ]] && \
           [[ "${{ needs.integration-tests.result }}" == "success" ]] && \
           [[ "${{ needs.cross-validation.result }}" == "success" ]] && \
           [[ "${{ needs.acceptance-tests.result }}" == "success" ]]; then
          echo "✅ All quality gates PASSED!"
          exit 0
        else
          echo "❌ Some quality gates FAILED"
          exit 1
        fi